name: Test ve yayınla

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # VIA tanım paketini haftada bir tazele.
    - cron: '17 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Playwright 1.56 has browser builds up to Ubuntu 24.04; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Birim testleri
        run: npm test
      - name: VIA tanım paketi
        run: npm run definitions
      - name: Derle
        run: npm run build:app
      - name: Test tarayıcısı
        run: npx playwright install --with-deps chromium
      - name: Uçtan uca testler
        run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
